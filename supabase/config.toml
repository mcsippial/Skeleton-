# Supabase CLI config for local development (`supabase start`).
# Only the settings Skeleton depends on are listed; everything else uses CLI defaults.
project_id = "skeleton"

[api]
enabled = true
port = 54321
schemas = ["public", "graphql_public"]
max_rows = 1000

[db]
port = 54322
major_version = 15

[studio]
enabled = true
port = 54323

[storage]
enabled = true
file_size_limit = "200MiB"

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = false

[edge_runtime]
enabled = true
policy = "per_worker"

[functions.parse-pain]
verify_jwt = true

[functions.cause-engine]
verify_jwt = true

[functions.pain-insight]
verify_jwt = true
