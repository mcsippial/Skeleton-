# XcodeGen spec. Generate the Xcode project with:  xcodegen generate
# (the .xcodeproj is generated, not committed, so merges never fight over project.pbxproj).
name: Skeleton
options:
  bundleIdPrefix: app.skeleton
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES

packages:
  SkeletonCore:
    path: Packages/SkeletonCore
  Supabase:
    url: https://github.com/supabase/supabase-swift
    from: 2.5.0

targets:
  Skeleton:
    type: application
    platform: iOS
    supportedDestinations: [iOS]
    configFiles:
      Debug: App/Config/Skeleton.xcconfig
      Release: App/Config/Skeleton.xcconfig
    sources:
      - path: App/Skeleton
        excludes:
          - Anatomy/**
      # Versioned atlas / pathway / red-flag JSON, bundled as a folder named "data".
      - path: data
        type: folder
        buildPhase: resources
      # Licensed anatomy (gitignored output of tools/anatomy/prepare_anatomy.py), bundled as "Anatomy".
      - path: App/Skeleton/Anatomy
        type: folder
        buildPhase: resources
        optional: true
    entitlements:
      path: App/Skeleton/Skeleton.entitlements
      properties:
        com.apple.developer.healthkit: true
        com.apple.developer.healthkit.access: []
    dependencies:
      - package: SkeletonCore
      - sdk: HealthKit.framework
      - package: Supabase
        product: Supabase
    info:
      path: App/Skeleton/Info.plist
      properties:
        CFBundleDisplayName: Skeleton
        CFBundleShortVersionString: "0.1.0"
        CFBundleVersion: "1"
        UILaunchScreen: {}
        UIApplicationSupportsIndirectInputEvents: true
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        ITSAppUsesNonExemptEncryption: false
        NSMicrophoneUsageDescription: Skeleton listens while you describe your pain, so you don't have to type.
        NSHealthShareUsageDescription: Skeleton reads sleep, heart rate variability, resting heart rate, steps, workouts and weight to show them next to your pain and help explain what may be driving it. It never writes to Health.
        NSHealthUpdateUsageDescription: Skeleton does not write to Apple Health.
        NSSpeechRecognitionUsageDescription: Your words are turned into text on this iPhone so Skeleton can place the pain on your body. Audio never leaves your device.
        SKSupabaseURL: $(SUPABASE_URL)
        SKSupabaseAnonKey: $(SUPABASE_ANON_KEY)
        SKServiceMode: $(SKELETON_SERVICES)
    settings:
      base:
        # Bundle ID and signing team come from App/Config/*.xcconfig so they survive `xcodegen generate`.
        TARGETED_DEVICE_FAMILY: "1"
        # HealthKit needs its entitlement embedded even in Simulator builds (ad-hoc signed when no team is set).
        CODE_SIGN_ENTITLEMENTS: App/Skeleton/Skeleton.entitlements
        "CODE_SIGN_IDENTITY[sdk=iphonesimulator*]": "-"
        GENERATE_INFOPLIST_FILE: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon

schemes:
  Skeleton:
    build:
      targets:
        Skeleton: all
    run:
      config: Debug
      # Live vs demo is set by SKELETON_SERVICES in App/Config/*.xcconfig (a scheme env var of the same name overrides it).
    test:
      config: Debug
      targets:
        - package: SkeletonCore/SkeletonCoreTests
    archive:
      config: Release
